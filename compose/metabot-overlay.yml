services:
  metabase:
    environment:
      MB_METABOT_ENABLED: "true"
      # Bare keys (no value) pass the var through only when it's set in the
      # shell, and omit it entirely otherwise. Don't use ${VAR:-} here — that
      # injects an empty string, which some Metabase versions treat as "set by
      # env var" and lock the Admin UI provider/model picker.
      MB_LLM_METABOT_PROVIDER:
      MB_LLM_ANTHROPIC_API_KEY:
      MB_LLM_ANTHROPIC_API_BASE_URL:
      MB_LLM_OPENROUTER_API_BASE_URL:
      MB_LLM_OPENROUTER_API_KEY:
