services:
  app-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${MB_APP_DB_NAME}
      POSTGRES_USER: ${MB_APP_DB_USER}
      POSTGRES_PASSWORD: ${MB_APP_DB_PASSWORD}
    ports:
      - "${APP_DB_PORT}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_APP_DB_USER} -d ${MB_APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase-enterprise:v${MB_IMAGE_TAG}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_APP_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_APP_DB_USER}
      MB_DB_PASS: ${MB_APP_DB_PASSWORD}
      MB_DB_HOST: app-db
      MB_PREMIUM_EMBEDDING_TOKEN: ${MB_PREMIUM_EMBEDDING_TOKEN}
      MB_LOAD_SAMPLE_CONTENT: ${MB_LOAD_SAMPLE_CONTENT}
      MB_CONFIG_FILE_PATH: /metabase-config/config.yml
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD}
      MB_ANALYST_EMAIL: ${MB_ANALYST_EMAIL}
      MB_ANALYST_PASSWORD: ${MB_ANALYST_PASSWORD}
      MB_SALES_EMAIL: ${MB_SALES_EMAIL}
      MB_SALES_PASSWORD: ${MB_SALES_PASSWORD}
      MB_AUTOMATION_API_KEY: ${MB_AUTOMATION_API_KEY}
      MB_SITE_URL: ${MB_SITE_URL}
      MB_SITE_NAME: ${MB_SITE_NAME}
      MB_APPLICATION_NAME: ${MB_APPLICATION_NAME}
      MB_ANALYTICS_PII_RETENTION_ENABLED: ${MB_ANALYTICS_PII_RETENTION_ENABLED}
      MB_CHECK_FOR_UPDATES: ${MB_CHECK_FOR_UPDATES}
      MB_ENABLE_EMBEDDING_INTERACTIVE: ${MB_ENABLE_EMBEDDING_INTERACTIVE}
      MB_ENABLE_EMBEDDING_SIMPLE: ${MB_ENABLE_EMBEDDING_SIMPLE}
      MB_ENABLE_EMBEDDING_SDK: ${MB_ENABLE_EMBEDDING_SDK}
      MB_ENABLE_EMBEDDING_STATIC: ${MB_ENABLE_EMBEDDING_STATIC}
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET_KEY}
      MB_SDK_ENCRYPTION_VALIDATION_KEY: ${MB_SDK_ENCRYPTION_VALIDATION_KEY}
      MB_EMBEDDING_APP_ORIGINS_INTERACTIVE: ${MB_EMBEDDING_APP_ORIGINS_INTERACTIVE}
      MB_EMBEDDING_APP_ORIGINS_SDK: ${MB_EMBEDDING_APP_ORIGINS_SDK}
      MB_PERSISTED_MODELS_ENABLED: ${MB_PERSISTED_MODELS_ENABLED}
      MB_QUERY_CACHING_MAX_KB: ${MB_QUERY_CACHING_MAX_KB}
      MB_QUERY_CACHING_MAX_TTL: ${MB_QUERY_CACHING_MAX_TTL}
      MB_TRANSFORMS_ENABLED: ${MB_TRANSFORMS_ENABLED}
      MB_AI_FEATURES_ENABLED: ${MB_AI_FEATURES_ENABLED}
      MB_METABOT_ENABLED: ${MB_METABOT_ENABLED}
      MB_LLM_METABOT_PROVIDER: ${MB_LLM_METABOT_PROVIDER}
      MB_LLM_ANTHROPIC_API_KEY: ${MB_LLM_ANTHROPIC_API_KEY}
      MB_METABOT_DEBUG_LLM_REQUESTS: ${METABOT_DEBUG_LLM:-false}
      SAMPLE_DB_NAME: ${SAMPLE_DB_NAME}
      SAMPLE_DB_USER: ${SAMPLE_DB_USER}
      SAMPLE_DB_PASSWORD: ${SAMPLE_DB_PASSWORD}
      SAMPLE_DB_DISPLAY_NAME: ${SAMPLE_DB_DISPLAY_NAME}
      MB_HTTP_CHANNEL_HOST_STRATEGY: ${MB_HTTP_CHANNEL_HOST_STRATEGY:-external-only}
    ports:
      - "${METABASE_PORT}:3000"
    volumes:
      - ../seed/metabase/config.yml:/metabase-config/config.yml:ro
      # LLM debug logs: when MB_METABOT_DEBUG_LLM_REQUESTS=true, Metabase writes
      # one JSON file per LLM API call to /logs/ai/requests/ inside the
      # container (relative to JVM working dir, which is /). This bind mount surfaces those files at
      # ./metabot-debug-logs/<stack>/ on the host — one subfolder per stack so
      # logs from concurrent stacks never intermingle.
      # Toggle on/off via METABOT_DEBUG_LLM in env/mb_versions/<version>.env.
      - type: bind
        source: ../metabot-debug-logs/${COMPOSE_PROJECT_NAME}
        target: /logs/ai/requests
    networks:
      - default
      - mb_shared
    depends_on:
      app-db:
        condition: service_healthy
      sample-dwh:
        condition: service_healthy

volumes:
  app_db_data:
    external: true
    name: ${APP_DB_VOLUME}

networks:
  mb_shared:
    external: true
